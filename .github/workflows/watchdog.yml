name: Watchdog - Polly Brief Ran Today
on:
  schedule:
    # 18:00 UTC -- a full 6 hours after Generate Polly Brief's own
    # 12:00 UTC schedule, giving ample buffer for that run (and, if
    # needed, GitHub's own scheduling delay) to complete before this
    # checks. Deliberately NOT the same time as polly-brief.yml's own
    # schedule -- they used to collide at 12:00 UTC after
    # polly-brief.yml reverted back to its original single daily
    # trigger, which would have meant checking for today's success
    # before the actual run had necessarily even started.
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Generate Polly Brief ran today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking for a Generate Polly Brief run on $TODAY (UTC)..."

          # Pull the last 20 runs of that specific workflow. 20 is
          # comfortably more than one day's worth even counting manual
          # re-runs, so no pagination needed.
          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/polly-brief.yml/runs?per_page=20")

          # SUCCESS_COUNT counts any successful run today, regardless of
          # trigger type (schedule vs. workflow_dispatch). This matters
          # because this workflow's OWN auto-trigger step below fires via
          # workflow_dispatch -- if we only counted "schedule" events as
          # success, a genuine rescue run would be invisible to this same
          # check, and a re-run one hour later (see check_again) would
          # see "0 successes" again and fire a redundant second rescue.
          #
          # Simpler than an earlier version of this check: that version
          # additionally verified each run's individual STEPS (not just
          # job-level conclusion), because polly-brief.yml used to poll
          # every 15 minutes and SKIP its real steps outside a narrow
          # time window -- a skipped-but-not-failed run still reports
          # job-level "success", which could have looked like a genuine
          # send. Now that polly-brief.yml is back to a single daily
          # trigger with no skip logic at all, every triggered run
          # genuinely executes the real pipeline, so job-level
          # .conclusion == "success" is trustworthy again on its own --
          # no need for the extra per-run API calls that added.
          SUCCESS_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select((.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")
          ANY_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")

          echo "Successful runs found for today: $SUCCESS_COUNT"
          echo "Any runs (including failed) found for today: $ANY_COUNT"
          echo "success_count=$SUCCESS_COUNT" >> "$GITHUB_OUTPUT"
          echo "any_count=$ANY_COUNT" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Auto-trigger Polly Brief if nothing succeeded yet today
        if: steps.check.outputs.success_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Nothing succeeded today. Auto-triggering Generate Polly Brief workflow..."
          gh workflow run polly-brief.yml -f test_mode=false -f publish_only=false
          echo "Workflow triggered successfully!"

  check_again:
    needs: check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Wait 1 hour and re-check if brief ran
        run: sleep 3600

      - name: Check whether Generate Polly Brief ran by now
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Rechecking for a Generate Polly Brief run on $TODAY (UTC)..."

          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/polly-brief.yml/runs?per_page=20")
          SUCCESS_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select((.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")
          ANY_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")

          echo "Successful runs found for today: $SUCCESS_COUNT"
          echo "Any runs (including failed) found for today: $ANY_COUNT"
          echo "success_count=$SUCCESS_COUNT" >> "$GITHUB_OUTPUT"
          echo "any_count=$ANY_COUNT" >> "$GITHUB_OUTPUT"

      - name: Final auto-trigger if nothing succeeded yet today
        if: steps.recheck.outputs.success_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Still nothing successful today. Final auto-trigger..."
          gh workflow run polly-brief.yml -f test_mode=false -f publish_only=false
