name: Watchdog - Polly Brief Ran Today
on:
  schedule:
    # Runs at 12:00 UTC. Generate Polly Brief itself no longer has a
    # single fixed schedule -- it self-polls every 15 minutes and only
    # actually proceeds inside a ~07:20-07:44 America/New_York window
    # (see polly-brief.yml). This check runs a comfortable margin after
    # that window closes, and auto-triggers a catch-up run if nothing
    # succeeded by then.
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Generate Polly Brief ran today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking for a Generate Polly Brief run on $TODAY (UTC)..."

          # Pull the last 20 runs of that specific workflow. 20 is
          # comfortably more than one day's worth even counting manual
          # re-runs, so no pagination needed.
          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/polly-brief.yml/runs?per_page=20")

          # SCHEDULED_COUNT checks specifically for a successful run
          # triggered by the natural cron schedule (event: "schedule"),
          # as distinct from a manual or auto-triggered catch-up (event:
          # "workflow_dispatch"). This is kept purely as a diagnostic
          # signal now -- see SUCCESS_COUNT below for what actually
          # decides whether to re-trigger.
          SCHEDULED_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.event == \"schedule\" and (.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")

          # SUCCESS_COUNT counts ANY successful run today, regardless of
          # trigger type. This is what actually decides whether to
          # auto-trigger below -- using SCHEDULED_COUNT for that decision
          # was a real bug: this workflow's own auto-trigger step fires
          # via workflow_dispatch, which SCHEDULED_COUNT can never count.
          # That meant a successful rescue run was invisible to this same
          # check, so a re-run one hour later (see check_again below)
          # would see "0 scheduled successes" again and fire a second,
          # unnecessary auto-trigger -- even though the brief had already
          # gone out. send_brevo.py's own campaign-name duplicate check
          # should still stop a second real email, but this was still
          # wasted API calls and confusing noise.
          SUCCESS_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select((.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")

          # ANY_COUNT is kept only to make the alert message more useful --
          # e.g. "you already caught this manually" vs "nothing ran at
          # all today" -- it does NOT suppress the alert either way.
          ANY_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")

          echo "Successful SCHEDULED runs found for today (diagnostic only): $SCHEDULED_COUNT"
          echo "Successful runs of ANY kind found for today (used for the trigger decision): $SUCCESS_COUNT"
          echo "Any runs (including failed/in-progress) found for today: $ANY_COUNT"
          echo "scheduled_count=$SCHEDULED_COUNT" >> "$GITHUB_OUTPUT"
          echo "success_count=$SUCCESS_COUNT" >> "$GITHUB_OUTPUT"
          echo "any_count=$ANY_COUNT" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Auto-trigger Polly Brief if nothing succeeded yet today
        if: steps.check.outputs.success_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scheduled trigger did not fire or run failed. Auto-triggering Generate Polly Brief workflow..."
          gh workflow run polly-brief.yml -f test_mode=false -f publish_only=false
          echo "Workflow triggered successfully!"

  # Second check one hour later if the first attempt to trigger failed
  check_again:
    needs: check
    runs-on: ubuntu-latest
    if: always()  # Run regardless of previous job status
    steps:
      - name: Wait 1 hour and re-check if brief ran
        run: sleep 3600

      - name: Check whether Generate Polly Brief ran by now
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Rechecking for a Generate Polly Brief run on $TODAY (UTC)..."

          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/polly-brief.yml/runs?per_page=20")
          SCHEDULED_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.event == \"schedule\" and (.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")
          # Same fix as the first check above: decide on ANY successful
          # run today, not just ones triggered by the natural schedule --
          # otherwise this recheck can never see its own sibling job's
          # earlier auto-trigger as a success, and fires a redundant
          # second one.
          SUCCESS_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select((.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")
          ANY_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")

          echo "Successful SCHEDULED runs found for today (diagnostic only): $SCHEDULED_COUNT"
          echo "Successful runs of ANY kind found for today (used for the trigger decision): $SUCCESS_COUNT"
          echo "Any runs (including failed/in-progress) found for today: $ANY_COUNT"
          echo "scheduled_count=$SCHEDULED_COUNT" >> "$GITHUB_OUTPUT"
          echo "success_count=$SUCCESS_COUNT" >> "$GITHUB_OUTPUT"
          echo "any_count=$ANY_COUNT" >> "$GITHUB_OUTPUT"

      - name: Final auto-trigger if nothing succeeded yet today
        if: steps.recheck.outputs.success_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Still nothing successful today. Final auto-trigger..."
          gh workflow run polly-brief.yml -f test_mode=false -f publish_only=false
          echo "Final workflow trigger sent!"
