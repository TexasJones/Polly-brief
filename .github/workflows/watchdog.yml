name: Watchdog - Polly Brief Ran Today
on:
  schedule:
    # Runs at 12:00 UTC (~7 AM CDT) -- one hour after the Generate Polly
    # Brief workflow's own 11:00 UTC schedule, giving it a full hour
    # to complete before the watchdog checks and auto-triggers if needed.
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Generate Polly Brief ran today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking for a Generate Polly Brief run on $TODAY (UTC)..."

          # Pull the last 20 runs of that specific workflow. 20 is
          # comfortably more than one day's worth even counting manual
          # re-runs, so no pagination needed.
          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/polly-brief.yml/runs?per_page=20")

          # SCHEDULED_COUNT checks the run's actual trigger event, not just
          # whether *a* run exists today. This distinction matters: earlier
          # versions of this check counted any run at all, which meant a
          # manually-triggered catch-up run (event: "workflow_dispatch")
          # looked identical to a real automatic success (event:
          # "schedule") -- silently hiding exactly the pattern this
          # watchdog exists to catch, since the person manually saving the
          # day every morning never saw an alert telling them the
          # automatic trigger itself kept failing.
          # We also now check .conclusion == "success" to ensure the run
          # actually succeeded and produced fresh content, not just that
          # it ran and failed.
          SCHEDULED_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.event == \"schedule\" and (.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")

          # ANY_COUNT is kept only to make the alert message more useful --
          # e.g. "you already caught this manually" vs "nothing ran at
          # all today" -- it does NOT suppress the alert either way.
          ANY_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")

          echo "Successful scheduled runs found for today: $SCHEDULED_COUNT"
          echo "Any runs (including manual) found for today: $ANY_COUNT"
          echo "scheduled_count=$SCHEDULED_COUNT" >> "$GITHUB_OUTPUT"
          echo "any_count=$ANY_COUNT" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Auto-trigger Polly Brief if scheduled trigger didn't fire
        if: steps.check.outputs.scheduled_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scheduled trigger did not fire or run failed. Auto-triggering Generate Polly Brief workflow..."
          gh workflow run polly-brief.yml -f test_mode=false -f publish_only=false
          echo "Workflow triggered successfully!"

  # Second check one hour later if the first attempt to trigger failed
  check_again:
    needs: check
    runs-on: ubuntu-latest
    if: always()  # Run regardless of previous job status
    steps:
      - name: Wait 1 hour and re-check if brief ran
        run: sleep 3600

      - name: Check whether Generate Polly Brief ran by now
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Rechecking for a Generate Polly Brief run on $TODAY (UTC)..."

          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/polly-brief.yml/runs?per_page=20")
          SCHEDULED_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.event == \"schedule\" and (.created_at | startswith(\"$TODAY\")) and .conclusion == \"success\")] | length")
          ANY_COUNT=$(echo "$RUNS_JSON" | jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")

          echo "Successful scheduled runs found for today: $SCHEDULED_COUNT"
          echo "Any runs (including manual) found for today: $ANY_COUNT"
          echo "scheduled_count=$SCHEDULED_COUNT" >> "$GITHUB_OUTPUT"
          echo "any_count=$ANY_COUNT" >> "$GITHUB_OUTPUT"

      - name: Final auto-trigger if still no run detected
        if: steps.recheck.outputs.scheduled_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Still no successful scheduled run detected. Final auto-trigger..."
          gh workflow run polly-brief.yml -f test_mode=false -f publish_only=false
          echo "Final workflow trigger sent!"
