name: Generate Polly Brief
on:
  schedule:
    # Single daily trigger, matching the original design that ran
    # reliably for weeks before this file was changed to a 15-minute
    # polling pattern. That polling redesign -- checking every 15
    # minutes, 96 times a day, and only actually proceeding inside a
    # narrow internal time window -- is almost certainly what
    # INTRODUCED the instability it was meant to fix: GitHub is
    # documented to deprioritize high-frequency scheduled triggers,
    # especially on public/free-tier repos, and the timing of this
    # repo's scheduling problems lines up with when that redesign
    # shipped, not before it. A single trigger a day creates far less
    # scheduling pressure, and it's the one configuration with actual
    # proven reliability behind it.
    #
    # Known limitation: this fixed UTC time does NOT auto-adjust for US
    # Daylight Saving Time, so the real-world Eastern-time delivery hour
    # will drift by an hour twice a year unless this line is manually
    # adjusted. Accepted tradeoff for going back to the simpler, proven
    # design rather than adding DST-handling complexity back in.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no sending, no committing)?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish_only:
        description: 'Publish only (commit + publish to Pages, but do NOT send the email)?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
      PUBLISH_ONLY: ${{ github.event.inputs.publish_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser
      - name: Generate the Brief
        run: python3 polly_brief/generate_brief.py --out polly_brief.html
      - name: Commit updated job snapshot and published brief
        if: ${{ env.TEST_MODE == 'false' }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add polly_brief/.state/seen_jobs.json docs/briefs/
          git diff --quiet --cached || git commit -m "Update seen jobs snapshot and publish brief"
          git push
      - name: List files (debug)
        run: |
          echo "Current directory:"
          pwd
          echo "Files here:"
          ls -la
      - name: Send via Brevo
        if: ${{ env.TEST_MODE == 'false' && env.PUBLISH_ONLY == 'false' }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: "The Polly Brief"
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
        run: python3 polly_brief/send_brevo.py --html-file polly_brief.html
      - name: Upload preview (test mode)
        if: ${{ env.TEST_MODE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brief-preview
          path: polly_brief.html
          retention-days: 1
