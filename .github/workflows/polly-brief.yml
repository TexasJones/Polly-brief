name: Generate Polly Brief
on:
  # No `schedule:` trigger here -- deliberately. GitHub's own scheduled
  # triggers turned out to be unreliable for this repo across every
  # configuration tried (15-minute polling, a narrow window, a widened
  # window, and finally the simplest possible single-daily cron) -- see
  # repo history for the full investigation. The actual daily trigger
  # now comes from an external cron service (cron-job.org) calling this
  # workflow's `workflow_dispatch` API endpoint directly at a fixed time
  # each morning -- the same trigger type as a manual run, which has
  # been reliable 100% of the time all along. If this workflow is ever
  # not firing as expected, check the external cron job's own execution
  # history first, not this file.
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (no sending, no committing)?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish_only:
        description: 'Publish only (commit + publish to Pages, but do NOT send the email)?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
      PUBLISH_ONLY: ${{ github.event.inputs.publish_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser
      - name: Generate the Brief
        run: python3 polly_brief/generate_brief.py --out polly_brief.html
      - name: Commit updated job snapshot and published brief
        if: ${{ env.TEST_MODE == 'false' }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add polly_brief/.state/seen_jobs.json polly_brief/.state/recent_stories.json docs/briefs/
          git diff --quiet --cached || git commit -m "Update seen jobs snapshot and publish brief"
          git push
      - name: List files (debug)
        run: |
          echo "Current directory:"
          pwd
          echo "Files here:"
          ls -la
      - name: Send via Brevo
        if: ${{ env.TEST_MODE == 'false' && env.PUBLISH_ONLY == 'false' }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: "The Polly Brief"
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
        run: python3 polly_brief/send_brevo.py --html-file polly_brief.html
      - name: Upload preview (test mode)
        if: ${{ env.TEST_MODE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brief-preview
          path: polly_brief.html
          retention-days: 1
